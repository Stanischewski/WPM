# Konfiguration für cargo-about: erzeugt THIRD-PARTY-LICENSES.txt mit den
# Lizenzhinweisen aller Bibliotheken, die in wpm.exe stecken (siehe README,
# Abschnitt „Lizenz“).
#
#   cargo about generate --locked --fail -o THIRD-PARTY-LICENSES.txt about.hbs

# Akzeptierte Lizenzen. Bei „A OR B“ gewinnt die weiter oben stehende.
accepted = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Bitstream-Vera",
    "MPL-2.0",
]

# Nur was in der Windows-EXE landet: keine Build- und Testwerkzeuge.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# WPM selbst (publish = false) steht in LICENSE, nicht bei den Drittanbietern.
[private]
ignore = true

# Die Standardschriften von egui stecken in der EXE. Das Paket nennt die
# Lizenzen von Hack (MIT und Bitstream Vera) und emoji-icon-font (MIT) nicht
# im Lizenzfeld, deshalb hier ausdrücklich. Ändert sich eine Datei, passt die
# Prüfsumme nicht mehr und cargo-about meldet das.
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0 AND Bitstream-Vera"

