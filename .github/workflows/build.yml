name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Release v<Version aus Cargo.toml> veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatierung prüfen
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release-Build
        run: cargo build --release
      - name: Ohne VC++-Laufzeit lauffähig?
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $dlls = & $dumpbin /nologo /dependents target\release\wpm.exe |
            Where-Object { $_ -match '\.dll\s*$' } | ForEach-Object { $_.Trim() }
          "Benötigte DLLs: $($dlls -join ', ')"
          if (-not $dlls) { Write-Error "dumpbin hat keine DLL-Liste geliefert" }
          if ($dlls -match 'vcruntime') {
            Write-Error "wpm.exe benötigt die VC++-Laufzeit – crt-static in .cargo/config.toml prüfen"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wpm-windows-x64
          path: target/release/wpm.exe

  # Passt THIRD-PARTY-LICENSES.txt (in die EXE eingebettet) noch zu den
  # Abhängigkeiten? Sonst mit cargo-about neu erzeugen, siehe README.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Lizenzhinweise aktuell?
        run: |
          if ! cargo about generate --locked --fail -o generated.txt about.hbs 2> about.log; then
            cat about.log
            exit 1
          fi
          cat about.log
          if grep -Ei "warn|error" about.log > /dev/null; then
            echo "::error::cargo-about meldet Probleme (siehe oben) – about.toml prüfen"
            exit 1
          fi
          if ! diff -u THIRD-PARTY-LICENSES.txt generated.txt; then
            echo "::error::THIRD-PARTY-LICENSES.txt ist veraltet – mit 'cargo about generate --locked --fail -o THIRD-PARTY-LICENSES.txt about.hbs' neu erzeugen und committen"
            exit 1
          fi

  # Veröffentlicht die EXE als Release – beim Push eines Tags `v<Version>`
  # oder per „Run workflow“ mit „Release veröffentlichen“. Der Download-Link
  # im README (releases/latest/download/wpm.exe) zeigt dann darauf.
  release:
    needs: [windows, licenses]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Version ermitteln
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $version in Cargo.toml"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            # Sonst würde „Run workflow“ die EXE eines bestehenden Releases ersetzen.
            echo "::error::$tag gibt es schon – zuerst die Version in Cargo.toml erhöhen"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: wpm-windows-x64
          path: dist
      - name: Prüfsumme
        working-directory: dist
        run: sha256sum wpm.exe > wpm.exe.sha256
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WPM ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/wpm.exe
            dist/wpm.exe.sha256
            THIRD-PARTY-LICENSES.txt
          generate_release_notes: true
          body: |
            **Download:** `wpm.exe` unten unter *Assets* herunterladen und doppelklicken – keine Installation nötig. Voraussetzung: Windows 10/11 mit winget (App-Installer). Funktionen und Anleitung: siehe [README](https://github.com/${{ github.repository }}#readme).

            Die EXE ist nicht digital signiert. Meldet Windows „Der Computer wurde durch Windows geschützt“, auf „Weitere Informationen“ → „Trotzdem ausführen“ klicken.

            Prüfsumme kontrollieren (optional): in PowerShell `Get-FileHash .\wpm.exe` ausführen und mit `wpm.exe.sha256` vergleichen.

            WPM steht unter der MIT-Lizenz. Die Lizenzhinweise der enthaltenen Open-Source-Bibliotheken stecken in der EXE (Einstellungen → Über → Lizenzen anzeigen) und liegen als `THIRD-PARTY-LICENSES.txt` bei.

  # Reicht die neue Version bei winget ein (Pull Request an microsoft/winget-pkgs).
  # Erst einschalten, wenn die erste Version dort aufgenommen ist: Variable
  # WINGET_PUBLISH=true und Secret WINGET_TOKEN (klassisches Token mit
  # public_repo und workflow) unter Settings → Secrets and variables → Actions.
  # Ein eigener Workflow mit „on: release“ würde nie starten, weil das Release
  # mit dem GITHUB_TOKEN angelegt wird – deshalb hier als weiterer Job.
  winget:
    needs: release
    if: vars.WINGET_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Stanischewski.WPM
          release-tag: ${{ needs.release.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
