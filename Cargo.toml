[package]
name = "wpm"
version = "0.2.2"
edition = "2024"
rust-version = "1.95"
description = "Einfache grafische Oberfläche für den Windows-Paketmanager winget"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "x11",
] }
egui_extras = "0.36"
dirs = "7"
raw-window-handle = "0.6"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
notify-rust = "4"
tray-icon = { version = "0.26", default-features = false }
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
