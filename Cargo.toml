[package]
name = "wpm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Einfache grafische Oberfläche für den Windows-Paketmanager winget"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "x11",
] }
egui_extras = "0.36"
dirs = "7"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
notify-rust = "4"
winreg = "0.56"

[profile.release]
lto = "thin"
strip = true
